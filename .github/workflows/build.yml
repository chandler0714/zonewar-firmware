name: Build ZoneWar Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: idf.py build && cd build && esptool.py --chip esp32c3 merge_bin -o ZoneWar-full.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x10000 ZoneWar.bin && ls -lh ZoneWar-full.bin ZoneWar.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneWar-firmware
          path: |
            build/ZoneWar-full.bin
            build/ZoneWar.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

      - name: Create release zip
        run: |
          ls -la build/
          cd build
          zip -j ZoneWar-firmware.zip ZoneWar-full.bin ZoneWar.bin
          ls -lh ZoneWar-firmware.zip

      - name: Update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除旧的 latest release 和 tag
          gh release delete latest -y 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          
          # 创建新的 release
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built firmware from commit ${{ github.sha }}
            - ZoneWar-full.bin: Full merged firmware (flash at 0x0)
            - ZoneWar.bin: App firmware only (flash at 0x10000)" \
            build/ZoneWar-firmware.zip
